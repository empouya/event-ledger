AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: StreamCore event-processing pipeline


# Globals apply default settings to ALL functions/APIs in this template.
# This avoids repeating the same config on every resource.
Globals:
    Function:
        Runtime: python3.12
        Architectures:
        - x86_64
        Tags:
            Project: StreamCore
            Environment: !Ref Environment


# Parameters let you pass different values per environment (dev/staging/prod)
# without changing the template itself.
Parameters:
    Environment:
        Type: String
        Default: dev
        AllowedValues: [dev, staging, prod]
    ShardCount:
        Type: Number
        Default: 1
        Description: >
            Number of Kinesis shards. 1 shard handles up to 1,000 events/sec write
            or 1 MB/sec write. Keep at 1 for LocalStack; increase for real AWS
            when approaching those throughput limits.

    RetentionPeriodHours:
        Type: Number
        Default: 24
        Description: >
            How long Kinesis retains events (hours). The spec requires 168h (7 days)
            in production for replay guarantees. Using 24h locally because LocalStack
            does not enforce retention and this keeps the local/real split honest.


# Resources is where all AWS infrastructure is declared.
Resources:
    # The API Gateway that exposes HTTP endpoints to the internet.
    # SAM creates and manages the underlying API Gateway resource automatically.
    StreamCoreApi:
        Type: AWS::Serverless::Api
        Properties:
            StageName: !Ref Environment   # URL will be: .../dev/health

    # The Lambda function that handles GET /health requests.
    HealthFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/health/    # Folder SAM packages and uploads to S3
            Handler: handler.lambda_handler  # filename.function_name
            Description: Returns HTTP 200 to confirm the API and Lambda are operational
            Environment:
                Variables:
                    # !Ref on a DynamoDB table returns the table name.
                    # Injected here so the handler never hardcodes it.
                    TABLE_NAME: !Ref EventsTable
            Policies:
                - Statement:
                    - Effect: Allow
                      Action: dynamodb:DescribeTable
                      Resource: !GetAtt EventsTable.Arn
            Events:
                HealthGet:
                    Type: Api
                    Properties:
                        RestApiId: !Ref StreamCoreApi
                        Path: /health
                        Method: GET
    # Ingest Lambda — hot-path entry point for POST /v1/events.
    # Receives the event body, stamps it with tenantId/ingestionId/ingestedAt,
    # and writes one Kinesis record. Must be lightweight — no heavy logic here.
    IngestFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/ingest/
            Handler: handler.lambda_handler
            Description: Accepts POST /v1/events, injects ingestion metadata, writes to Kinesis
            Timeout: 10         # seconds — well above p99 even under load
            MemorySize: 256     # MB — sufficient for a simple Kinesis PutRecord call
            Environment:
                Variables:
                    # Stream name from CloudFormation — never hardcoded.
                    # !Ref on a Kinesis stream returns its name (not ARN).
                    EVENT_STREAM_NAME: !Ref EventStream
            Policies:
                # Least-privilege: only the one action this function actually calls.
                - Statement:
                    - Effect: Allow
                      Action: kinesis:PutRecord
                      Resource: !GetAtt EventStream.Arn
            Events:
                IngestPost:
                    Type: Api
                    Properties:
                        RestApiId: !Ref StreamCoreApi
                        Path: /v1/events
                        Method: POST

    # Consumer Lambda — reads from Kinesis in batches and writes to DynamoDB.
    # This is the only writer to EventsTable; the Ingest Lambda never touches DynamoDB.
    #
    # BatchSize 100 / window 5s: Kinesis will call this function when it has
    # 100 records OR 5 seconds have passed, whichever comes first.
    # BisectBatchOnFunctionError: on any unhandled exception, Kinesis splits the
    # batch in half and retries each half separately — isolating bad records
    # without replaying the entire batch from scratch.
    ConsumerFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/consumer/
            Handler: handler.lambda_handler
            Description: Decodes Kinesis records and starts one Step Functions execution per event
            Timeout: 60
            MemorySize: 256
            Environment:
                Variables:
                    STATE_MACHINE_ARN: !Ref ProcessingStateMachine
            Policies:
                - Statement:
                    - Effect: Allow
                      Action: states:StartExecution
                      Resource: !Ref ProcessingStateMachine
                    # Required for the ESM on-failure destination.
                    # Lambda service writes the failure envelope to this queue
                    # on behalf of this function's execution role.
                    - Effect: Allow
                      Action: sqs:SendMessage
                      Resource: !GetAtt ValidationDLQ.Arn
            Events:
                KinesisStream:
                    Type: Kinesis
                    Properties:
                        Stream: !GetAtt EventStream.Arn
                        StartingPosition: LATEST
                        BatchSize: 100
                        MaximumBatchingWindowInSeconds: 5
                        # BisectBatchOnFunctionError: if the Lambda crashes entirely,
                        # Kinesis bisects the batch and retries each half — second
                        # line of defence after ReportBatchItemFailures.
                        BisectBatchOnFunctionError: true
                        # ReportBatchItemFailures: the Lambda returns
                        # {"batchItemFailures": [...]} so only failing records
                        # are retried, not the whole batch.
                        FunctionResponseTypes:
                            - ReportBatchItemFailures
                        # After 2 retries (3 total attempts), exhausted records
                        # go to the on-failure destination below.
                        MaximumRetryAttempts: 2
                        DestinationConfig:
                            OnFailure:
                                Type: SQS
                                Destination: !GetAtt ValidationDLQ.Arn

    # CloudWatch log group for the Step Functions state machine.
    #
    # EXPRESS executions have no built-in console history — the only way
    # to observe what happened inside an execution is CloudWatch Logs.
    # IncludeExecutionData: true means the full input/output of each state
    # is written to the log, which is essential for debugging.
    ProcessingStateMachineLogs:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "/aws/states/streamcore-processing-${Environment}"
            RetentionInDays: 30
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # Validator Lambda — Step 1 of the processing workflow.
    # Receives the full event envelope and raises ValidationError
    # if any field fails the schema or business rules.
    # No environment variables needed here — all config is in code constants.
    ValidatorFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/validator/
            Handler: handler.lambda_handler
            Description: Validates event envelope and type-specific fields
            Timeout: 10
            MemorySize: 256

    # PII Extractor Lambda — Step 2 of the processing workflow.
    # Receives the validated event envelope, fetches the per-tenant
    # HMAC-SHA256 salt from Secrets Manager, and replaces every PII
    # field in the payload with its digest. Raw values are never logged
    # or returned.
    PiiExtractorFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/pii_extractor/
            Handler: handler.lambda_handler
            Description: Replaces PII field values with HMAC-SHA256 digests keyed by tenant salt
            Timeout: 10
            MemorySize: 256
            Policies:
                - Statement:
                    - Effect: Allow
                      Action: secretsmanager:GetSecretValue
                      Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:streamcore/pii-salt/*"

    # Enricher Lambda — Step 3 of the processing workflow.
    # Adds processedAt, pipelineVersion, and schemaVersionUsed to the event.
    # These are pipeline-side facts the client SDK cannot set.
    EnricherFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/enricher/
            Handler: handler.lambda_handler
            Description: Adds processedAt, pipelineVersion, and schemaVersionUsed to the event
            Timeout: 10
            MemorySize: 256
            Environment:
                Variables:
                    PIPELINE_VERSION: "2.0.0"


    # Writer Lambda — Step 4 of the processing workflow.
    # Persists the enriched event to DynamoDB (queryable) and S3 (archive).
    # DynamoDB write is idempotent: attribute_not_exists(PK) condition
    # suppresses duplicate writes on Lambda retries.
    WriterFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: functions/writer/
            Handler: handler.lambda_handler
            Description: Writes processed events to DynamoDB and S3; idempotent via conditional put
            Timeout: 15
            MemorySize: 256
            Environment:
                Variables:
                    TABLE_NAME: !Ref EventsTable
                    EVENTS_BUCKET: !Ref EventsBucket
            Policies:
                - Statement:
                    - Effect: Allow
                      Action: dynamodb:PutItem
                      Resource: !GetAtt EventsTable.Arn
                    - Effect: Allow
                      Action: s3:PutObject
                      Resource: !Sub "${EventsBucket.Arn}/*"

    # Step Functions state machine — orchestrates the four-step processing
    # workflow: validate → hash PII → enrich → persist.
    #
    # Type EXPRESS:
    #   - Built for high-volume, short-lived (< 5 min) executions.
    #   - Significantly cheaper than STANDARD for per-event invocations.
    #   - No built-in execution history; CloudWatch logging is mandatory.
    #   - Supports start-sync-execution (returns result synchronously),
    #     which STANDARD does not — useful for request/response patterns.
    #
    # Notice: Now we choose Standard to have more descriptions for testing!
    #
    # DefinitionSubstitutions injects the Lambda ARN into the ASL file at
    # deploy time, replacing ${ValidatorFunctionArn} with the real ARN.
    # This keeps ARNs out of the ASL and lets CloudFormation manage them.
    ProcessingStateMachine:
        Type: AWS::Serverless::StateMachine
        Properties:
            DefinitionUri: statemachines/processing.asl.json
            DefinitionSubstitutions:
                ValidatorFunctionArn: !GetAtt ValidatorFunction.Arn
                PiiExtractorFunctionArn: !GetAtt PiiExtractorFunction.Arn
                EnricherFunctionArn: !GetAtt EnricherFunction.Arn
                WriterFunctionArn: !GetAtt WriterFunction.Arn
                ValidationDLQUrl: !Ref ValidationDLQ
                PersistenceDLQUrl: !Ref PersistenceDLQ
            Type: STANDARD
            Logging:
                Destinations:
                    - CloudWatchLogsLogGroup:
                        LogGroupArn: !GetAtt ProcessingStateMachineLogs.Arn
                IncludeExecutionData: true
                Level: ALL
            Policies:
                - Statement:
                    - Effect: Allow
                      Action: lambda:InvokeFunction
                      Resource:
                          - !GetAtt ValidatorFunction.Arn
                          - !GetAtt PiiExtractorFunction.Arn
                          - !GetAtt EnricherFunction.Arn
                          - !GetAtt WriterFunction.Arn
                    # CloudWatch log delivery requires these nine actions.
                    # None of them support resource-level constraints — AWS
                    # mandates Resource: '*' for CreateLogDelivery and its siblings.
                    - Effect: Allow
                      Action:
                          - logs:CreateLogDelivery
                          - logs:GetLogDelivery
                          - logs:UpdateLogDelivery
                          - logs:DeleteLogDelivery
                          - logs:ListLogDeliveries
                          - logs:PutLogEvents
                          - logs:PutResourcePolicy
                          - logs:DescribeResourcePolicies
                          - logs:DescribeLogGroups
                      Resource: "*"
                    - Effect: Allow
                      Action: sqs:SendMessage
                      Resource:
                          - !GetAtt ValidationDLQ.Arn
                          - !GetAtt PersistenceDLQ.Arn
            Tags:
                Project: StreamCore
                Environment: !Ref Environment


    # Durable buffer between the ingestion API and the Consumer Lambda.
    # Kinesis holds events for RetentionPeriodHours, decoupling how fast
    # we accept events from how fast we can process them.
    #
    # Partition key strategy: tenantId (set by the Ingest Lambda on PutRecord).
    # All events from the same tenant land on the same shard, so their relative
    # order is preserved — essential for correct per-tenant event sequencing.
    #
    # Hot-partition note: if one tenant generates dramatically more traffic than
    # others, its shard becomes a bottleneck. Acceptable at this scale; revisit
    # with Application Auto Scaling at higher volumes.
    EventStream:
        Type: AWS::Kinesis::Stream
        Properties:
            Name: !Sub "streamcore-events-${Environment}"
            ShardCount: !Ref ShardCount
            RetentionPeriodHours: !Ref RetentionPeriodHours
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # Raw event archive. Every processed event is written here as a JSON
    # object partitioned by tenantId/eventType/date/eventId.json.
    # Date partitioning lets Athena prune queries to a single day's prefix
    # without scanning the full bucket.
    EventsBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "streamcore-events-raw-${Environment}"
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # Queryable store for processed events.
    #
    # Key design:
    #   PK  = tenantId#eventType   — fast single-partition queries per tenant+type
    #   SK  = processedAt#ingestionId — chronological sort; ingestionId ensures uniqueness
    #
    # GSI-1 lets you query all event types for a tenant across a time range,
    # e.g. "everything tenant X sent between 09:00 and 10:00".
    #
    # TTL on expiresAt: DynamoDB deletes items automatically after 90 days.
    # The Consumer Lambda writes expiresAt as a Unix epoch integer.
    # Note: PITR and SSE-KMS are real-AWS hardening — LocalStack ignores them.

    EventsTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Sub "streamcore-events-${Environment}"
            BillingMode: PAY_PER_REQUEST   # On-Demand — no capacity planning needed
            AttributeDefinitions:
                - AttributeName: PK
                  AttributeType: S
                - AttributeName: SK
                  AttributeType: S
                - AttributeName: GSI1PK
                  AttributeType: S
                - AttributeName: GSI1SK
                  AttributeType: S
            KeySchema:
                - AttributeName: PK
                  KeyType: HASH
                - AttributeName: SK
                  KeyType: RANGE
            GlobalSecondaryIndexes:
                - IndexName: GSI1
                  KeySchema:
                      - AttributeName: GSI1PK
                        KeyType: HASH
                      - AttributeName: GSI1SK
                        KeyType: RANGE
                  Projection:
                      ProjectionType: ALL
            TimeToLiveSpecification:
                AttributeName: expiresAt
                Enabled: true
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # Dead-letter queue for events that fail Step 1 (schema validation).
    #
    # FIFO queue guarantees ordered delivery and exactly-once processing of
    # failed events. ContentBasedDeduplication is off — we will set an
    # explicit MessageDeduplicationId = eventId when sending messages in
    # the state machine Catch blocks (task 3.2). That way SQS drops any
    # duplicate failure for the same event within the 5-minute dedup window.
    #
    # 14-day retention is the SQS maximum, giving ops the largest possible
    # investigation and replay window.
    ValidationDLQ:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: !Sub "streamcore-validation-dlq-${Environment}.fifo"
            FifoQueue: true
            ContentBasedDeduplication: false
            MessageRetentionPeriod: 1209600   # 14 days = 14 × 24 × 3600 seconds
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # Dead-letter queue for events that fail Step 4 (persistence: DynamoDB + S3).
    PersistenceDLQ:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: !Sub "streamcore-persistence-dlq-${Environment}.fifo"
            FifoQueue: true
            ContentBasedDeduplication: false
            MessageRetentionPeriod: 1209600
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

    # SNS topic that receives CloudWatch alarm state-change notifications (task 3.5).
    # Must be a standard (non-FIFO) topic — CloudWatch alarms cannot publish to
    # FIFO SNS topics. Subscriptions (PagerDuty, email) are Phase 5/6.
    OpsAlertsTopic:
        Type: AWS::SNS::Topic
        Properties:
            TopicName: !Sub "streamcore-ops-alerts-${Environment}"
            Tags:
                - Key: Project
                  Value: StreamCore
                - Key: Environment
                  Value: !Ref Environment

Outputs:
    ProcessingStateMachineArn:
        Description: ARN of the event processing state machine
        Value: !GetAtt ProcessingStateMachine.Arn
    ValidationDLQUrl:
        Description: URL of the validation dead-letter queue
        Value: !Ref ValidationDLQ
    ValidationDLQArn:
        Description: ARN of the validation dead-letter queue
        Value: !GetAtt ValidationDLQ.Arn
    PersistenceDLQUrl:
        Description: URL of the persistence dead-letter queue
        Value: !Ref PersistenceDLQ
    PersistenceDLQArn:
        Description: ARN of the persistence dead-letter queue
        Value: !GetAtt PersistenceDLQ.Arn
    OpsAlertsTopicArn:
        Description: ARN of the ops alerts SNS topic
        Value: !Ref OpsAlertsTopic
