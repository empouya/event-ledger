# samconfig.toml — deploy configuration per environment
# Usage: sam deploy --config-env dev

version = 0.1

[dev.deploy.parameters]
stack_name           = "streamcore-dev"
region               = "eu-west-1"
confirm_changeset    = true
capabilities         = "CAPABILITY_IAM"
parameters_overrides = "Environment=dev"
tags                 = "Project=StreamCore Environment=dev"
resolve_s3 = true